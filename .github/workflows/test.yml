name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint (biome)
        run: bunx biome check .
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Tests
        run: bunx vitest run
      - name: Build core package (ESM + declarations)
        run: bun run --cwd packages/core build

  e2e-exelearning-compat:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Fetch pinned eXeLearning static editor
        run: bun run e2e:fetch-editor
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: E2E (compat)
        env:
          # Full-template .elpx builds for large fixtures (interactive-book, etc.)
          # need more than the default ~4 GB Node heap on ubuntu-latest.
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
