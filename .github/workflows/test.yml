name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # bun lint only ships in Bun canary so far; bun fmt and bun test are in the stable release too.
          bun-version: canary
      - run: bun install --frozen-lockfile
      - name: Lint and format (bun lint, bun fmt)
        run: bun run lint
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Tests
        run: bun run test
      - name: Build core package (ESM + declarations)
        run: bun run --cwd packages/core build

  e2e-exelearning-compat:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Fetch pinned eXeLearning static editor
        run: bun run e2e:fetch-editor
      - name: Install Playwright Chromium
        run: bunx --bun playwright install --with-deps chromium
      - name: E2E (compat)
        run: bun run test:e2e
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
